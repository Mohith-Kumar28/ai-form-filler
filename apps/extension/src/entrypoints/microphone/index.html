<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microphone access — Fillaform</title>
  </head>
  <body>
    <!--
      This page exists for one reason: a Chrome side panel cannot show the microphone prompt.

      `getUserMedia` in a side panel rejects with NotAllowedError without ever asking the user,
      so the panel could only report a refusal nobody had made. A top-level extension tab is a
      normal browsing context and does get the prompt, and the grant it earns belongs to the
      extension's origin — so the panel can use the microphone immediately afterwards.
    -->
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
